# Wheeler service-extension registry: shipped CATALOG of services.
#
# This file is bundled with the package and is the CATALOG: every service that
# is AVAILABLE to enable. It does NOT directly decide what is loaded.
#
# The ENABLED set (what the router and plan acts actually see) is curated in the
# folder .wheeler/services/ : each <id>.yaml file there is one enabled contract.
# Curate it with `wheeler services enable/disable` (or by editing the folder by
# hand). load_services precedence:
#   1. if .wheeler/services/ exists, that folder is the source of truth;
#   2. else the legacy single-file override .wheeler/services.yaml, if present;
#   3. else this bundled catalog (every default enabled until you start curating).
# The folder always wins over the single-file override.
#
# Each entry is a declarative service CONTRACT (one manifest entry per tool):
#   id          stable identifier (kebab-case)
#   provider    the upstream provider (e.g. asta, local)
#   name        human-readable display name
#   description what the service does (one line)
#   kind        shell-out | local
#   act         the /wh:* slash command that drives the service
#   cost        free-text cost/time hint, surfaced as a warning by the router
#   available   shell probe; non-zero exit or missing binary => unavailable
#   when        free-text trigger hint ("use this when ...")
#   inputs      the interview schema: what the router asks the scientist before
#               dispatch. Each port: {name, kind, required, prompt, ...}.
#                 kind: node   -> a graph-node reference; node_type is the label
#                                 (Dataset, Question, ...) and source names the
#                                 graph query that offers the options.
#                 kind: choice -> options + default (rendered as a pick list).
#                 kind: text   -> free text (e.g. a search query).
#               The registry treats inputs opaquely; wheeler/integrations/
#               invocation.py interprets them for the router/plan acts.
#   output      raw_node + produced node types (documentation of the result).
#
# No em dashes anywhere. The router lists only AVAILABLE services.

services:
  - id: paper-finder
    provider: asta
    name: Paper Finder
    description: broad semantic literature discovery, relevance-ranked
    kind: shell-out
    act: /wh:asta-lit
    cost: "cheap"
    available: "asta auth status"
    when: "broad literature discovery (find papers on X, what is known about Y)"
    inputs:
      - { name: query, kind: text, source: query, required: true, prompt: "What should Paper Finder search for?" }
      - { name: link_to, kind: node, node_type: Question, source: query, required: false, prompt: "Which open question or plan does this support?" }
    output:
      raw_node: dataset
      nodes: [Paper]

  - id: theorizer
    provider: asta
    name: Theorizer
    description: literature-grounded theory generation with supporting and contradicting evidence
    kind: shell-out
    act: /wh:asta-theorize
    cost: "expensive (~$7, ~20min)"
    available: "asta auth status"
    when: "hypothesis or theory generation (generate theories about X, what could explain Y)"
    inputs:
      - { name: query, kind: text, source: query, required: true, prompt: "What question should Theorizer generate theories for?" }
      - { name: link_to, kind: node, node_type: Question, source: query, required: false, prompt: "Which open question or plan does this support?" }
    output:
      raw_node: document
      nodes: [Finding, Hypothesis, Paper]

  - id: semantic-scholar
    provider: asta
    name: Semantic Scholar
    description: precise paper lookup plus the citation graph plus snippet evidence
    kind: shell-out
    act: /wh:asta-scholar
    cost: "cheap"
    available: "asta auth status"
    when: "a specific paper, its citations, or snippet evidence (look up Z, what cites Y)"
    inputs:
      - { name: query, kind: text, source: query, required: true, prompt: "Which paper, citation, or snippet query?" }
      - { name: link_to, kind: node, node_type: Question, source: query, required: false, prompt: "Which open question or plan does this support?" }
    output:
      raw_node: dataset
      nodes: [Paper]

  - id: scholar-qa
    provider: asta
    name: Asta Literature Reports
    description: long-form literature review report synthesizing many papers into a written document with citations
    kind: shell-out
    act: /wh:asta-report
    cost: "cheap (literature find + papers lookups)"
    available: "asta auth status"
    when: "a written literature review or comprehensive multi-paper report (write a review of X, synthesize the literature on Y)"
    inputs:
      - { name: query, kind: text, source: query, required: true, prompt: "What topic should the literature review cover?" }
      - { name: link_to, kind: node, node_type: Question, source: query, required: false, prompt: "Which open question or plan does this support?" }
    output:
      raw_node: document
      nodes: [Document, Paper]
    # implemented by wheeler/integrations/asta/scholar_qa.py

  - id: graph-status
    provider: local
    name: Graph Status
    description: local read-only summary of the current Wheeler knowledge graph
    kind: local
    act: /wh:status
    cost: "free"
    available: "wheeler graph status"
    when: "a quick local snapshot of graph health and recent activity, no external service"

  - id: llmsr-discover
    provider: llmsr
    name: LLM-SR Equation Discovery
    description: discover a closed-form equation from a dataset via LLM-guided evolutionary search
    kind: local
    act: /wh:llmsr-discover
    cost: "slow (dozens of sub-agent rounds, minutes)"
    available: "wheeler llmsr --help"
    when: "discover or fit a closed-form equation / symbolic model from a dataset"
    inputs:
      # `--data` is REPEATABLE and the unit of fitting is a (dataset, group) pair,
      # so this port is `multi`. A single-valued dataset port could not interview
      # for the run the engine is actually built around: ONE form scored across
      # several tables, each refitting its own constants, which tests the FORM
      # rather than one lucky parameterization.
      - { name: datasets, kind: node, node_type: Dataset, source: datasets, multi: true, required: true, prompt: "Which dataset(s) should the equation be fit to? Name several to ask whether ONE form governs them all." }
      # The two roles a table can play, kept apart on purpose. They choose among
      # the datasets just named, which no static list can know, hence `from`.
      - { name: seed_from, kind: text, from: datasets, required: false, prompt: "Which dataset should shape the prompt? That is where the FORM comes from. Default: the first one named." }
      - { name: score_on, kind: text, from: datasets, multi: true, required: false, prompt: "Which datasets should enter the objective? A dataset named here IS optimized against, so its error is a training number. Default: all of them." }
      - { name: group_by, kind: text, required: false, prompt: "Which column names the group each row belongs to (cell, trial, subject)? Each group refits its OWN constants under the same form. Leave empty for one pooled fit." }
      - { name: question, kind: node, node_type: Question, source: query, required: false, prompt: "Which open question or plan does this address?" }
      # Four OPEN registries: a scientist registers their own metric, loader,
      # optimizer or picks a recipe, and every one of them must be offerable.
      # `options_from` asks the registry at read time; the static `options` stay
      # as the fallback if that resolution ever fails.
      - { name: metric, kind: choice, options_from: "wheeler.integrations.llmsr.metrics:available", options: [nmse, mse], default: nmse, required: true, prompt: "Which scoring metric should the search optimize?" }
      - { name: recipe, kind: choice, options_from: "wheeler.integrations.llmsr.recipes:available", options: [pooled, refit_per_group, transfer], default: pooled, required: false, prompt: "Which scoring recipe should the spec use? `wheeler llmsr recipes` says what each one measures, assumes and costs." }
      - { name: loader, kind: choice, options_from: "wheeler.integrations.llmsr.loaders:available", options: [csv], default: csv, required: false, prompt: "How should the recording be read off disk?" }
      # `choices`, not `available`: the strategy `auto` is a legal answer and is
      # the default, but it is not a concrete registered optimizer.
      - { name: optimizer, kind: choice, options_from: "wheeler.integrations.llmsr.optimizers:choices", options: [auto, bfgs, nelder-mead], default: auto, required: false, prompt: "Which optimizer should fit the free constants? `auto` runs BFGS and escalates to Nelder-Mead where no start moved." }
      - { name: select, kind: choice, options: [parsimony, ood, fit], default: parsimony, required: false, prompt: "How should the winning equation be selected?" }
      # The island model. Upstream's defaults are sized for ~10,000 candidates
      # and a run here spends tens, so leaving these unasked hands the scientist
      # 10 near-empty islands and a four-hour reset clock that never fires.
      - { name: islands, kind: text, required: false, prompt: "How many islands should the experience buffer hold? Match it to the sample budget: upstream's 10 leaves 2 to 3 programs each at 25 candidates, which is no population to evolve. Default: upstream's 10." }
      - { name: reset_every, kind: text, required: false, prompt: "Reset the weakest half of the islands every how many accepted submissions? This is the diversity mechanism, and upstream's wall-clock period never fires on a run shorter than four hours. Aim for a handful of resets: about a third of the sample budget. Default: off." }
      # A DEVIATION, and the prompt has to say so: the paper clusters on the raw
      # continuous score and nothing upstream rounds or bins it.
      - { name: cluster_tolerance, kind: text, required: false, prompt: "Quantize the score signature so candidates within this FACTOR cluster together? This DEVIATES from the published method, which clusters on the raw score. The effect is real but modest: measured on a 26-submission run, raw gave 35 clusters with 0 holding more than one program, 1.8x gave 32 and 3, 3.2x gave 30 and 4. It is diluted by the island count and wider is not monotonically better. Ask for it only deliberately. Default: off, which is the paper." }
    output:
      raw_node: document
      nodes: [Script, Finding]
    # implemented by wheeler/integrations/llmsr/discover.py

  - id: llmsr-transfer
    provider: llmsr
    name: LLM-SR Form Transfer
    description: refit a discovered equation's constants on data the search never saw, to ask whether the FORM generalizes
    kind: local
    act: /wh:llmsr-transfer
    # One refit per group on one table, using the source run's own fit knobs. No
    # search, no generator, no sub-agent rounds: this is the cheap half of the
    # discovery workflow, and its cost scales with the number of groups.
    cost: "fast (one refit per group on the held-out table, seconds to minutes)"
    available: "wheeler llmsr --help"
    when: "test whether a discovered equation's FORM generalizes to a recording the search never scored"
    inputs:
      # The RUN is the form. It is named by id, not chosen from the graph: run
      # dirs live on disk under `.wheeler/llmsr/runs/` and are not graph nodes.
      - { name: run, kind: text, required: true, prompt: "Which LLM-SR run holds the form to transfer? Its run id or run dir." }
      # ONE table, deliberately: `wheeler llmsr transfer --data` is single-valued,
      # unlike `init --data`, and a port that offered a list would interview for
      # a call the verb cannot make.
      - { name: dataset, kind: node, node_type: Dataset, source: datasets, required: true, prompt: "Which held-out recording should the form be transferred onto? It must be data the search never scored, or the answer is a training number." }
      - { name: group_by, kind: text, required: false, prompt: "Which column names the group each row of the HELD-OUT table belongs to? Each group refits its OWN constants. Default: the source run's own --group-by." }
      # No `options_from` on this contract: nothing here is backed by an open
      # registry. The metric, loader and optimizer are the SOURCE RUN'S and are
      # read off its meta.json, because a transfer fitted differently from the
      # search that produced the form is not comparable with it.
      - { name: select, kind: choice, options: [fit, ood, parsimony], default: fit, required: false, prompt: "How should the candidate be picked when none is named explicitly? The same rules as `best`." }
      - { name: candidate, kind: text, required: false, prompt: "Which candidate (sample_order) should be transferred? Leave empty to transfer the winner the run's own selection rules pick." }
      - { name: question, kind: node, node_type: Question, source: query, required: false, prompt: "Which open question or plan does this generalization test address?" }
    output:
      raw_node: document
      nodes: [Finding, Dataset]
    # implemented by wheeler/integrations/llmsr/transfer_ingest.py

  - id: asta-assistant
    provider: asta
    name: Asta Research Assistant
    description: long-range autonomous research assistant that drives a mission project to completion, harvested into the graph with provenance
    kind: local
    act: /wh:asta-assistant
    cost: "long-running (autonomous multi-step loop; you drive it with /loop in a new terminal)"
    available: "asta --version"
    when: "long-range autonomous research: seed a mission from the graph, run it open-endedly, harvest results back"
    inputs:
      - { name: mission, kind: node, node_type: Question, source: query, required: false, prompt: "Which open question or plan is the mission?" }
      - { name: findings, kind: node, node_type: Finding, source: findings, required: false, prompt: "Which findings should seed the mission background?" }
      - { name: datasets, kind: node, node_type: Dataset, source: datasets, required: false, prompt: "Which datasets should the mission operate on?" }
    output:
      raw_node: document
      nodes: [Document, Finding, Dataset]
    # implemented by wheeler/integrations/asta/assistant.py
